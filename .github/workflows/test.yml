# La suite come guardiano automatico. Le garanzie del progetto — il bundle che
# non può divergere dai sorgenti, il registro delle fonti che non può mentire —
# valgono solo se qualcosa esegue i test a ogni push: questo workflow è quel
# qualcosa. Zero dipendenze da installare, come in locale.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
